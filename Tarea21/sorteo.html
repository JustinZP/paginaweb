<!-- ==========================================================================
  SORTEO NOW — BLOQUE ÚNICO COMPLETO
  Pega TODO esto en tu index.html, justo ANTES de esta línea:

  <div id="shopify-section-template--26594380873975__newsletter_MEP3JX" ...

  No necesitas tocar el menú: el script agrega solo la opción "SORTEO" en el
  menú de escritorio y en el del celular, y lleva al formulario con scroll suave.
=========================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap" rel="stylesheet">

<style>
  html { scroll-behavior: smooth; }
  #sorteo { scroll-margin-top: 100px; }

  .sorteo {
    --negro: #000;
    --blanco: #fff;
    --coral: #f2686b;
    background: var(--negro);
    color: var(--blanco);
    padding: 80px 24px;
    font-family: "Archivo", Arial, sans-serif;
  }
  .sorteo__wrap {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 56px;
    align-items: center;
  }
  .sorteo__titulo {
    font-family: "Archivo Black", Arial, sans-serif;
    font-style: italic;
    font-size: clamp(2.6rem, 7vw, 5.2rem);
    line-height: .95;
    margin: 0 0 20px;
    text-transform: uppercase;
    color: var(--blanco);
  }
  .sorteo__premio { color: var(--coral); display: block; }
  .sorteo__texto { font-size: 1.1rem; line-height: 1.5; max-width: 46ch; color: #ddd; }
  .sorteo__fecha {
    margin-top: 24px;
    display: inline-block;
    border: 2px solid var(--blanco);
    padding: 10px 16px;
    font-weight: 600;
  }

  .sorteo__form { background: var(--blanco); color: var(--negro); padding: 32px; }
  .sorteo__form h3 {
    font-family: "Archivo Black", Arial, sans-serif;
    font-style: italic;
    font-size: 1.5rem;
    margin: 0 0 20px;
    text-transform: uppercase;
    color: var(--negro);
  }
  .sorteo .campo { margin-bottom: 16px; }
  .sorteo .campo label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--negro); }
  .sorteo .campo input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    font: inherit;
    color: var(--negro);
    border: 2px solid var(--negro);
    border-radius: 0;
    background: var(--blanco);
  }
  .sorteo .campo input:focus-visible { outline: 3px solid var(--coral); outline-offset: 1px; }
  .sorteo .campo.error input { border-color: #c62828; }
  .sorteo .campo .msg { color: #c62828; font-size: .85rem; margin-top: 4px; min-height: 1em; }

  .sorteo .acepto { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; margin: 8px 0 6px; color: var(--negro); }
  .sorteo .acepto input { margin-top: 3px; accent-color: var(--negro); width: auto; }
  .sorteo #sAceptoMsg { color: #c62828; font-size: .85rem; min-height: 1em; margin-bottom: 12px; }

  .sorteo__btn {
    width: 100%;
    padding: 16px;
    border: 0;
    background: var(--negro);
    color: var(--blanco);
    font-family: "Archivo Black", Arial, sans-serif;
    font-style: italic;
    font-size: 1.1rem;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s;
  }
  .sorteo__btn:hover { background: var(--coral); }
  .sorteo__btn:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

  .sorteo__ok { display: none; text-align: center; padding: 24px 0; color: var(--negro); }
  .sorteo__codigo {
    display: inline-block;
    margin-top: 14px;
    padding: 10px 18px;
    background: var(--negro);
    color: var(--blanco);
    font-family: "Archivo Black", Arial, sans-serif;
    letter-spacing: 2px;
  }

  @media (max-width: 820px) {
    .sorteo__wrap { grid-template-columns: 1fr; gap: 36px; }
    .sorteo { padding: 56px 18px; }
    #sorteo { scroll-margin-top: 70px; }
  }
</style>

<section class="sorteo" id="sorteo">
  <div class="sorteo__wrap">

    <div>
      <h2 class="sorteo__titulo">
        Sorteo NOW
        <span class="sorteo__premio">Gana un outfit completo</span>
      </h2>
      <p class="sorteo__texto">
        Regístrate y participa por un outfit completo NOW más S/300 en compras.
        Solo necesitas tu nombre, correo y teléfono.
      </p>
      <span class="sorteo__fecha" id="sorteoFecha"></span>
    </div>

    <div class="sorteo__form">
      <form id="sorteoForm" novalidate>
        <h3>Participa ahora</h3>

        <div class="campo">
          <label for="sNombre">Nombre completo</label>
          <input id="sNombre" name="nombre" type="text" autocomplete="name" placeholder="Ej. María Quispe">
          <div class="msg"></div>
        </div>

        <div class="campo">
          <label for="sCorreo">Correo</label>
          <input id="sCorreo" name="correo" type="email" autocomplete="email" placeholder="tucorreo@gmail.com">
          <div class="msg"></div>
        </div>

        <div class="campo">
          <label for="sTelefono">Teléfono</label>
          <input id="sTelefono" name="telefono" type="tel" inputmode="numeric" maxlength="9" autocomplete="tel-national" placeholder="9 dígitos, ej. 987654321">
          <div class="msg"></div>
        </div>

        <label class="acepto">
          <input type="checkbox" id="sAcepto">
          <span>Acepto las bases del sorteo y el uso de mis datos para contactarme si gano.</span>
        </label>
        <div id="sAceptoMsg"></div>

        <div id="sFormMsg" role="alert" style="color:#c62828;font-size:.9rem;min-height:1em;margin-bottom:12px"></div>
        <button class="sorteo__btn" type="submit">Quiero participar</button>
      </form>

      <div class="sorteo__ok" id="sorteoOk" role="status" aria-live="polite">
        <h3>¡Ya estás participando!</h3>
        <p>Guarda tu código de participación:</p>
        <span class="sorteo__codigo" id="sorteoCodigo"></span>
      </div>
    </div>

  </div>
</section>

<script>
(() => {
  /* ===== CONFIGURA AQUÍ ===== */
  const FECHA_SORTEO = "30 de noviembre de 2026";
  const TEXTO_MENU   = "SORTEO 🎁";
  const API_URL      = "http://127.0.0.1:5000/api/sorteo"; // en producción: https://TU-DOMINIO/api/sorteo
  /* ========================== */

  /* ---------- Enlace "SORTEO" en el menú (escritorio y celular) ---------- */
  function agregarAlMenu() {
    // Escritorio
    const ulDesktop = document.querySelector(".site-control__inline-links .tier-1 > ul");
    if (ulDesktop && !ulDesktop.querySelector(".nav-sorteo")) {
      const li = document.createElement("li");
      li.className = "featured-link";
      li.innerHTML = '<a href="#sorteo" class="nav-sorteo">' + TEXTO_MENU + '</a>';
      ulDesktop.appendChild(li);
    }
    // Celular
    const ulMovil = document.querySelector("#page-menu .main-nav > ul");
    if (ulMovil && !ulMovil.querySelector(".nav-sorteo")) {
      const li = document.createElement("li");
      li.className = "featured-link";
      li.innerHTML = '<a href="#sorteo" class="nav-sorteo"><span>' + TEXTO_MENU + '</span></a>';
      ulMovil.appendChild(li);
    }
  }

  // Scroll suave + cierra el menú del celular al tocar la opción
  document.addEventListener("click", (e) => {
    const a = e.target.closest(".nav-sorteo");
    if (!a) return;
    e.preventDefault();
    const destino = document.getElementById("sorteo");
    if (!destino) return;

    const toggle = document.querySelector("[data-modal-nav-toggle]");
    const menu = document.getElementById("page-menu");
    const menuAbierto = menu && getComputedStyle(menu).visibility !== "hidden" && menu.offsetParent !== null;
    if (menuAbierto && toggle) toggle.click();

    setTimeout(() => {
      destino.scrollIntoView({ behavior: "smooth", block: "start" });
      history.replaceState(null, "", "#sorteo");
    }, menuAbierto ? 350 : 0);
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", agregarAlMenu);
  } else {
    agregarAlMenu();
  }

  /* ---------- Formulario ---------- */
  document.getElementById("sorteoFecha").textContent = "Sorteo el " + FECHA_SORTEO;

  const form = document.getElementById("sorteoForm");
  const ok = document.getElementById("sorteoOk");

  function error(input, texto) {
    const campo = input.closest(".campo");
    campo.classList.toggle("error", !!texto);
    campo.querySelector(".msg").textContent = texto || "";
    return !texto;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nombre = form.nombre.value.trim();
    const correo = form.correo.value.trim().toLowerCase();
    const telefono = form.telefono.value.trim();
    const msgGeneral = document.getElementById("sFormMsg");
    const boton = form.querySelector(".sorteo__btn");
    msgGeneral.textContent = "";

    let valido = true;
    valido &= error(form.nombre, nombre.length >= 3 ? "" : "Escribe tu nombre completo.");
    valido &= error(form.correo, /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo) ? "" : "Escribe un correo válido.");
    valido &= error(form.telefono, /^9\d{8}$/.test(telefono) ? "" : "Debe tener 9 dígitos y empezar con 9.");

    const aceptoOk = document.getElementById("sAcepto").checked;
    document.getElementById("sAceptoMsg").textContent = aceptoOk ? "" : "Debes aceptar las bases para participar.";
    valido &= aceptoOk;
    if (!valido) return;

    const textoBoton = boton.textContent;
    boton.disabled = true;
    boton.textContent = "Enviando...";

    try {
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, correo, telefono })
      });
      const data = await resp.json().catch(() => ({}));

      if (resp.ok && data.ok) {
        form.style.display = "none";
        document.getElementById("sorteoCodigo").textContent = data.codigo;
        ok.style.display = "block";
      } else if (data.campo && form[data.campo]) {
        error(form[data.campo], data.error || "Revisa este dato.");
      } else {
        msgGeneral.textContent = data.error || "No pudimos registrarte. Inténtalo de nuevo.";
      }
    } catch (err) {
      msgGeneral.textContent = "No hay conexión con el servidor. Inténtalo en unos minutos.";
    } finally {
      boton.disabled = false;
      boton.textContent = textoBoton;
    }
  });

  form.telefono.addEventListener("input", () => {
    form.telefono.value = form.telefono.value.replace(/\D/g, "");
  });
})();
</script>
